version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edgetruth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/edgetruth
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: web/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  edge-node-1:
    build:
      context: web/node_agent
    environment:
      - API_URL=http://backend:8000/api
      - NODE_ID=edge-agent-01
      - NODE_NAME=London Edge Agent 01
      - REGION=EU-West
      - CAPACITY_CPU=8
      - CAPACITY_MEMORY=16384
      - TRUE_LATENCY_MS=12.0
      - NODE_TYPE=HONEST_STABLE
      - CAPABILITIES=docker,python,ml
    depends_on:
      - backend

  edge-node-2:
    build:
      context: web/node_agent
    environment:
      - API_URL=http://backend:8000/api
      - NODE_ID=edge-agent-02
      - NODE_NAME=Berlin Edge Agent 02
      - REGION=EU-Central
      - CAPACITY_CPU=4
      - CAPACITY_MEMORY=8192
      - TRUE_LATENCY_MS=25.0
      - NODE_TYPE=HONEST_STABLE
      - CAPABILITIES=docker
    depends_on:
      - backend

  edge-node-3:
    build:
      context: web/node_agent
    environment:
      - API_URL=http://backend:8000/api
      - NODE_ID=edge-sybil-03
      - NODE_NAME=Malicious Sybil 03
      - REGION=US-East
      - CAPACITY_CPU=16
      - CAPACITY_MEMORY=32768
      - TRUE_LATENCY_MS=150.0
      - NODE_TYPE=LIAR
      - CAPABILITIES=docker,python,wasm
    depends_on:
      - backend

volumes:
  postgres_data:
